[project]
name = "pomona"
# From Cargo.toml's workspace version, through crates/pomona-native.
dynamic = ["version"]
description = "A viewer for Apple Screen Sharing, in Standard mode over plain TCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "crates/apple-adaptive/LICENSE"]
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = ["cryptography>=46"]
keywords = ["vnc", "rfb", "screen sharing", "remote desktop", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/dehesselle/pomona"
Documentation = "https://github.com/dehesselle/pomona/tree/master/docs"
Source = "https://github.com/dehesselle/pomona"
Issues = "https://github.com/dehesselle/pomona/issues"

[project.scripts]
pomona = "pomona:main"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/pomona-native/Cargo.toml"
python-source = "src"
module-name = "pomona._native"
features = ["pyo3/extension-module"]
# Bytecode a test run left in the source tree has no place in a wheel.
exclude = ["**/__pycache__/**"]

[tool.uv]
# Rebuild the extension on `uv sync`/`uv run` when the Rust side changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]
# Without cargo, maturin installs Rust through puccinialin: it would silently download
# more than 2 GiB in the background without the user's consent. Fail instead.
build-constraint-dependencies = ["puccinialin<0"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Ruff comes from outside the project, and its defaults change between minor
# releases; bump this once a new minor's findings have been reviewed, together
# with the pins in .github/workflows/build.yml and docs/DEVELOPMENT.md.
required-version = "~=0.16.0"

[tool.ruff.lint.isort]
# The extension, pomona._native, has no source file for ruff to find.
known-first-party = ["pomona"]
