[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# The package version: maturin takes it from pomona-native, which inherits it
# from here. Bump it by hand for a release.
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
