name: Build
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  #-----------------------------------------------------------------------------

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable

      # Build, which makes the wheel, uses no cache: one poisoned here never
      # reaches a release.
      - name: Cache Rust build # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # keep aligned with [tool.ruff] in pyproject.toml
      - name: Check formatting
        run: uvx --from 'ruff~=0.16.0' ruff format --check .

      - name: Lint
        run: uvx --from 'ruff~=0.16.0' ruff check .

      - name: Check REUSE compliance
        run: uvx reuse lint

      # our crate only: apple-adaptive keeps upstream's formatting
      - name: Check Rust formatting
        run: cargo fmt -p pomona-native --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  #-----------------------------------------------------------------------------

  Test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # on PATH for cargo test: without maturin, PyO3 links against libpython
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable

      # Build, which makes the wheel, uses no cache: one poisoned here never
      # reaches a release.
      - name: Cache Rust build # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Lint runs on Linux only; each system compiles its own cfg code
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run tests
        run: uv run --locked pytest

  #-----------------------------------------------------------------------------

  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          # PyPI takes no wheel tagged plain linux; one built in the manylinux
          # image links no glibc newer than the tag allows.
          - name: linux-x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # read on macOS only: the oldest macOS the wheel runs on, whatever the runner's
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # the manylinux image has no rustup
      - name: Install rustup
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # no cache: a release is built from nothing other branches can write to
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # maturin tags the wheel, and fails if it links outside the policy
      - name: Target manylinux_2_28
        if: matrix.container
        run: echo "MATURIN_PEP517_ARGS=--compatibility manylinux_2_28" >> "$GITHUB_ENV"

      # abi3: one wheel for every Python from 3.12 up
      - name: Build wheel
        run: uv build --wheel --no-sources

      - name: Smoke-test wheel
        run: |
          uv run --isolated --no-project --python 3.12 --with dist/*.whl python - <<'EOF'
          import os
          from importlib.metadata import version
          import pomona
          import pomona._native
          print(version("pomona"))
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              assert version("pomona") == expected, (version("pomona"), expected)
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/

  #-----------------------------------------------------------------------------

  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - Lint
      - Test
      - Build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --generate-notes

  #-----------------------------------------------------------------------------

  PyPI:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - Build
      - Release
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pomona

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
